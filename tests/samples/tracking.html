<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google-analytics.com; connect-src https://api.analytics.com https://track.example.com; object-src 'none'">
  <title>Tracking Sample</title>
</head>
<body>
  <h1>Tracking calls</h1>
  <script>fetch("https://api.analytics.com/track", {method: "POST", body: data})</script>
  <script src="https://www.google-analytics.com/analytics.js"></script>
  <script>navigator.sendBeacon("https://track.example.com/collect", data);</script>
</body>
</html>
