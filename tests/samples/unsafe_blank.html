<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'">
  <title>Unsafe Blank Target Sample</title>
</head>
<body>
  <h1>Blank target links</h1>
  <a href="https://example.com" target="_blank">Link without rel</a>
  <a href="https://other.com" target="_blank" rel="noopener">Safe link</a>
</body>
</html>
